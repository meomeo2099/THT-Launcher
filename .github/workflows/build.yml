name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Giải mã keystore
        env:
          KS: ${{ secrets.THT_SIGN_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/tht.jks"
            echo "THT_SIGN_STORE_FILE=$RUNNER_TEMP/tht.jks" >> "$GITHUB_ENV"
            echo "Có keystore ($(stat -c%s "$RUNNER_TEMP/tht.jks") bytes)"
          else
            echo "::warning::Không có secret THT_SIGN_KEYSTORE_BASE64 – bản release sẽ ký bằng khóa debug"
          fi
      - name: Build
        env:
          THT_SIGN_STORE_PASSWORD: ${{ secrets.THT_SIGN_STORE_PASSWORD }}
          THT_SIGN_KEY_ALIAS: ${{ secrets.THT_SIGN_KEY_ALIAS }}
          THT_SIGN_KEY_PASSWORD: ${{ secrets.THT_SIGN_KEY_PASSWORD }}
        run: |
          set -o pipefail
          gradle :app:assembleDebug :app:assembleRelease 2>&1 | tee build.log
      - name: Kiểm tra chữ ký
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER=$(ls "$SDK"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          echo "::notice::apksigner=$APKSIGNER"
          for f in $(find app/build/outputs/apk -name '*.apk'); do
            info=$("$APKSIGNER" verify --print-certs "$f" 2>&1 | grep -E "certificate DN|SHA-256" | tr '\n' ' ')
            echo "::notice::$(basename "$f"): ${info:-KHÔNG ĐỌC ĐƯỢC CHỮ KÝ}"
          done
      - name: Report errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|ERROR:" -A4 build.log | head -60 > err.txt || true
          while IFS= read -r l; do echo "::error::$l"; done < err.txt
      - name: Phát hành (push lên main hoặc chạy tay)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          APK=$(ls app/build/outputs/apk/release/THT-Launcher-*-release.apk | head -1)
          gh release create "$TAG" "$APK" --target "${{ github.sha }}" \
            --title "THT Launcher 0.2.${{ github.run_number }}" \
            --notes "Bản build tự động từ ${{ github.ref_name }} @ ${GITHUB_SHA::7}. Launcher tự cập nhật từ đây (Cài đặt → Cập nhật)."
      - uses: actions/upload-artifact@v4
        with:
          name: tht-launcher-apk
          path: app/build/outputs/apk/**/*.apk
