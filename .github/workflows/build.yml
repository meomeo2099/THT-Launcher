name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - uses: android-actions/setup-android@v3
      - name: Build
        run: |
          set -o pipefail
          gradle :app:assembleDebug :app:assembleRelease 2>&1 | tee build.log
      - name: Report errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|ERROR:" -A4 build.log | head -60 > err.txt || true
          while IFS= read -r l; do echo "::error::$l"; done < err.txt
      - uses: actions/upload-artifact@v4
        with:
          name: tht-launcher-apk
          path: app/build/outputs/apk/**/*.apk
