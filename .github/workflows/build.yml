name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Giải mã keystore
        env:
          KS: ${{ secrets.THT_SIGN_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/tht.jks"
            echo "THT_SIGN_STORE_FILE=$RUNNER_TEMP/tht.jks" >> "$GITHUB_ENV"
            echo "Có keystore ($(stat -c%s "$RUNNER_TEMP/tht.jks") bytes)"
          else
            echo "::warning::Không có secret THT_SIGN_KEYSTORE_BASE64 – bản release sẽ ký bằng khóa debug"
          fi
      - name: Build
        env:
          THT_SIGN_STORE_PASSWORD: ${{ secrets.THT_SIGN_STORE_PASSWORD }}
          THT_SIGN_KEY_ALIAS: ${{ secrets.THT_SIGN_KEY_ALIAS }}
          THT_SIGN_KEY_PASSWORD: ${{ secrets.THT_SIGN_KEY_PASSWORD }}
        run: |
          set -o pipefail
          gradle :app:assembleDebug :app:assembleRelease 2>&1 | tee build.log
      - name: Kiểm tra chữ ký
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          for f in app/build/outputs/apk/release/*.apk; do
            $APKSIGNER verify --print-certs "$f" | grep -E "Signer #1 certificate (DN|SHA-256)" | sed "s/^/::notice::$(basename $f): /"
          done
      - name: Report errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|ERROR:" -A4 build.log | head -60 > err.txt || true
          while IFS= read -r l; do echo "::error::$l"; done < err.txt
      - uses: actions/upload-artifact@v4
        with:
          name: tht-launcher-apk
          path: app/build/outputs/apk/**/*.apk
